[build-system]
requires = ["setuptools>=75", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-attn"
dynamic = ["version"]
description = "FlexAttention backend implemented with NVIDIA CuTe DSL"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    {name = "Tri Dao"},
    {name = "FlashAttention CuTe DSL contributors"},
]
dependencies = [
    "nvidia-cutlass-dsl==4.5.2",
    "torch",
    "typing_extensions",
    "quack-kernels==0.5.0",
]

[project.optional-dependencies]
cu13 = ["nvidia-cutlass-dsl[cu13]==4.5.2"]
dev = ["pytest", "pytest-xdist", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/gpu"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741", "F841", "D102"]

[tool.ruff.lint.per-file-ignores]
"src/flex_attn/kernels/sm90/**" = ["F401"]
